# Trace configuration for Firebird 5.0.x (also 4.0.x) - input for PSFirebirdTraceParser
#
# Derived from fbtrace30.conf. All options exist unchanged in the Firebird 5.0.4 template
# (src/utilities/ntrace/fbtrace.conf). The log format of 4.0 and 5.0 is the same; the parser reads both.
#
# Important for the parser:
#   - print_plan = true and explain_plan = false: the parser reads only the classic "PLAN (...)".
#   - print_perf = true: gives the table statistics (Natural/Index/...).
#   - max_sql_length large enough, otherwise SQL is cut after 300 characters.

database
{
	enabled = true

	# Only statements that run longer than this many milliseconds.
	# 100 is a good start. Smaller = more data (0 = everything, the log gets very large).
	time_threshold = 100

	# Connections (user, address, application)
	log_connections = true

	# Transactions (start/end)
	log_transactions = true

	# Finished statements with duration, reads/writes/fetches
	log_statement_finish = true

	# All errors (lock conflicts, deadlocks, update conflicts, corruption, disk and network errors).
	# Do NOT set include_gds_codes: when it is set, Firebird writes ONLY the listed codes
	# (TracePluginImpl.cpp). Hide unwanted errors with exclude_gds_codes instead.
	log_errors = true

	# Sweeps (start, progress, end, failure) with the transaction counters OIT/OAT/OST/Next
	log_sweep = true

	# Start/end of the trace session itself
	log_initfini = false

	# Execution plan in the classic format (keep explain_plan off)
	print_plan = true
	#explain_plan = false

	# Table statistics per statement
	print_perf = true

	# Lengths and counts. 65000 has proven itself.
	max_sql_length = 65000
	max_arg_length = 240
	max_arg_count = 50

	# New in Firebird 5.0 (unknown in 4.0 -> keep commented out there):
	# compiling of procedures/functions/triggers. The parser does not read these events.
	#log_procedure_compile = false
	#log_function_compile = false
	#log_trigger_compile = false
}

# Services: backup, restore, statistics, user management, ... (service name, service ID, connection).
# log_service_query = false: no events for status queries (gbak/nbackup ask often, the log would grow).
services
{
	enabled = true
	log_services = true
	log_service_query = false
	log_errors = true
}
